server:
  # 默认只监听本机；需求约定见《详细设计文档》附录 D（J4）
  address: 127.0.0.1
  port: 18080

spring:
  application:
    name: synclavis4j
  jackson:
    default-property-inclusion: always
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
    time-zone: Asia/Shanghai

synclavis:
  state:
    # 可用环境变量 SYNCLAVIS_HOME 覆盖（附录 D / J8）
    dir: "${SYNCLAVIS_HOME:${user.home}/.synclavis}"
  plugins:
    # 本地插件目录；可用 SYNCLAVIS_PLUGIN_DIR 单独覆盖（见《详细设计文档》§6.4.1）
    dir: "${SYNCLAVIS_PLUGIN_DIR:${synclavis.state.dir}/plugins}"
  ai:
    mock:
      # 仅开发/联调启用；生产环境不要打开（见《详细设计文档》§6.5.4）
      enabled: "${SYNCLAVIS_AI_MOCK_ENABLED:false}"
    opencode:
      # 默认启用；服务未运行时只显示不可用，不影响启动
      enabled: "${SYNCLAVIS_OPENCODE_ENABLED:true}"
      # 留空时读取 $XDG_STATE_HOME/opencode/service.json 或 ~/.local/state/opencode/service.json
      service-file: "${SYNCLAVIS_OPENCODE_SERVICE_FILE:}"
      timeout-ms: "${SYNCLAVIS_OPENCODE_TIMEOUT_MS:10000}"

logging:
  level:
    root: INFO
    com.sonsure.synclavis4j: DEBUG
  file:
    name: logs/synclavis4j.log
